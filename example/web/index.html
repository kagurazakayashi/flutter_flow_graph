<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flutter Flow Graph</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #loading { display: flex; align-items: center; justify-content: center; height: 100%; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="loading">載入中…</div>
  <script>
    var serviceWorkerVersion = null;
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) return;
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.appendChild(scriptTag);
    }
    if (typeof flutter_web_prefetch !== 'undefined') { loadMainDartJs(); }
    else { window.addEventListener('flutter-first-frame', loadMainDartJs); }
  </script>
</body>
</html>
